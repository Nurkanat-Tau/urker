<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бет табылмады — Ürker</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20261128c">
  <!-- Страница для неправильных адресов. Пути абсолютные: GitHub отдаёт её по любому адресу. -->
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px var(--gutter); }
    .nf-mark { width: 120px; height: 75px; color: var(--brass); margin: 0 auto 28px; }
    .nf h1 { font-size: 34px; margin-bottom: 10px; }
    .nf p { color: var(--text-soft); margin-bottom: 6px; }
    .nf-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    .nf hr { width: 48px; border: 0; border-top: 1px solid var(--rule); margin: 28px auto; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <svg class="nf-mark" viewBox="0 0 64 40" aria-hidden="true">
        <g stroke="currentColor" stroke-width=".8" stroke-linecap="round" opacity=".55">
          <line x1="16" y1="26" x2="29" y2="30"/><line x1="29" y1="30" x2="38" y2="22"/><line x1="38" y1="22" x2="52" y2="24"/>
          <line x1="52" y1="24" x2="55" y2="15"/><line x1="38" y1="22" x2="24" y2="13"/><line x1="24" y1="13" x2="12" y2="7"/>
        </g>
        <g fill="currentColor">
          <circle cx="38" cy="22" r="3.2"/><circle cx="52" cy="24" r="2.4"/><circle cx="55" cy="15" r="1.7"/><circle cx="29" cy="30" r="2.2"/>
          <circle cx="16" cy="26" r="2.4"/><circle cx="24" cy="13" r="2.1"/><circle cx="12" cy="7" r="1.8"/>
        </g>
      </svg>
      <!-- TODO: проверить носителем -->
      <h1>Бұл бет табылмады</h1>
      <p>Сілтеме қате немесе бет көшірілген.</p>
      <hr>
      <p lang="ru">Такой страницы нет. Возможно, ссылка с ошибкой.</p>
      <div class="nf-links">
        <a class="btn" href="/">Басты бет</a>
        <a class="btn btn-outline" href="/ru/" lang="ru">На главную</a>
      </div>
    </div>
  </main>
</body>
</html>
