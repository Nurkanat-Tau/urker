<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Заголовок, описание и Open Graph — единственный текст в этом файле:
    их читают WhatsApp/Instagram при пересылке ссылки, а они не запускают JS.
    Видимые тексты — в content.js.
  -->
  <title>Ürker Executive — Уақытың — сенің таңбаң</title>
  <meta name="description" content="Сымсыз қуаттандыратын, LED-жарығы бар премиум күнделік. Атыңызды гравировкалаймыз. Қазақстан бойынша жеткізу.">
  <meta name="theme-color" content="#121212">
  <!-- Пока на сайте заглушки, просим поисковики не индексировать. Уберите перед запуском. -->
  <meta name="robots" content="noindex">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ürker">
  <meta property="og:locale" content="kk_KZ">
  <meta property="og:locale:alternate" content="ru_RU">
  <meta property="og:title" content="Ürker Executive — Уақытың — сенің таңбаң">
  <meta property="og:description" content="Сымсыз қуаттандыратын, LED-жарығы бар премиум күнделік. Атыңызды гравировкалаймыз.">
  <!-- Когда подключите свой домен, замените адреса на https://urker.kz/... -->
  <meta property="og:url" content="https://nurkanat-tau.github.io/urker/">
  <meta property="og:image" content="https://nurkanat-tau.github.io/urker/images/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <!-- Знак Ürker: 7 звёзд Үркер (Плеяды). Те же координаты — в art.js -->
    <symbol id="stars" viewBox="0 0 64 40">
      <g stroke="currentColor" stroke-width=".8" stroke-linecap="round" opacity=".55">
        <line x1="16" y1="26" x2="29" y2="30"/><line x1="29" y1="30" x2="38" y2="22"/><line x1="38" y1="22" x2="52" y2="24"/>
        <line x1="52" y1="24" x2="55" y2="15"/><line x1="38" y1="22" x2="24" y2="13"/><line x1="24" y1="13" x2="12" y2="7"/>
      </g>
      <g fill="currentColor">
        <circle cx="38" cy="22" r="3.2"/><circle cx="52" cy="24" r="2.4"/><circle cx="55" cy="15" r="1.7"/><circle cx="29" cy="30" r="2.2"/>
        <circle cx="16" cy="26" r="2.4"/><circle cx="24" cy="13" r="2.1"/><circle cx="12" cy="7" r="1.8"/>
      </g>
    </symbol>
    <symbol id="wa-icon" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M4.2 19.8l1.1-3.9A8.4 8.4 0 1 1 8.4 19l-4.2.8z"/>
      <path fill="currentColor" d="M9.3 7.6c.2 0 .4 0 .5.4l.7 1.6c.1.2 0 .4-.1.6l-.5.6c-.1.1-.1.3 0 .5.6 1 1.4 1.8 2.5 2.4.2.1.4.1.5-.1l.6-.7c.1-.2.4-.2.6-.1l1.6.8c.2.1.3.3.3.5 0 .9-.7 1.7-1.6 1.8-1.1.1-2.6-.4-4-1.7-1.5-1.4-2.3-3-2.3-4.1 0-.9.6-1.6 1.2-1.7z"/>
    </symbol>
    <symbol id="ig-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/></g>
      <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#main" data-t="skipLink"></a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#top" data-t-attr="aria-label:logoLabel">
        <svg class="logo-mark" viewBox="0 0 64 40" aria-hidden="true" focusable="false"><use href="#stars"/></svg>
        <span class="logo-word" aria-hidden="true">Ürker</span>
      </a>
      <div class="header-right">
        <a class="ig-link js-ig" target="_blank" rel="noopener" data-t-attr="aria-label:instagramLabel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ig-icon"/></svg>
        </a>
        <div class="lang-switch" role="group" data-t-attr="aria-label:langSwitchLabel">
          <button type="button" data-lang="kk" lang="kk"></button>
          <button type="button" data-lang="ru" lang="ru"></button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- 1. Первый экран -->
    <section class="hero" id="top">
      <div class="wrap hero-grid">
        <div class="hero-text">
          <p class="kind" data-t="hero.kind"></p>
          <h1><span class="product" data-t="hero.product"></span><span class="slogan" data-t="hero.slogan"></span></h1>
          <p class="lead" data-t="hero.lead"></p>
          <div class="price-row">
            <svg class="price-star" viewBox="0 0 64 40" aria-hidden="true"><use href="#stars"/></svg>
            <span class="price-label" data-t="hero.priceLabel"></span>
            <span class="price js-price"></span>
          </div>
          <a class="btn" href="#order" data-t="hero.cta"></a>
          <ul class="facts" data-list="hero.facts"></ul>
        </div>
        <figure class="hero-media">
          <div class="art" data-art="hero" data-t-attr="aria-label:hero.imageAlt" role="img"></div>
          <figcaption class="sketch-note" data-t="hero.sketchNote"></figcaption>
        </figure>
      </div>
    </section>

    <!-- 2. Почему Үркер (светлый блок) -->
    <section class="story" aria-labelledby="story-title">
      <div class="wrap story-grid">
        <svg class="story-stars" viewBox="0 0 64 40" aria-hidden="true"><use href="#stars"/></svg>
        <div>
          <h2 id="story-title" data-t="story.title"></h2>
          <p class="story-text" data-t="story.text"></p>
        </div>
      </div>
    </section>

    <!-- 3. Три отличия -->
    <section class="section features reveal" aria-labelledby="features-title">
      <div class="wrap">
        <h2 id="features-title" data-t="features.title"></h2>
        <div class="feature-list" data-list="features.items"></div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"><svg viewBox="0 0 64 40"><use href="#stars"/></svg></div>

    <!-- 4. Характеристики -->
    <section class="section specs reveal" aria-labelledby="specs-title">
      <div class="wrap specs-grid">
        <div>
          <h2 id="specs-title" data-t="specs.title"></h2>
          <dl class="spec" data-list="specs.items"></dl>
        </div>
        <div class="art art-colors" data-art="colors" data-t-attr="aria-label:specs.colorsAlt" role="img"></div>
      </div>
    </section>

    <!-- 5. Конструктор заказа -->
    <section class="builder" id="order" aria-labelledby="builder-title" tabindex="-1">
      <div class="wrap builder-grid">
        <div class="preview-col">
          <div class="preview art" id="preview" role="img" data-t-attr="aria-label:builder.previewAlt"></div>
          <p class="preview-caption"><span id="preview-color"></span> · <span id="preview-font"></span></p>
        </div>

        <div class="builder-col">
          <h2 id="builder-title" data-t="builder.title"></h2>
          <p class="builder-intro" data-t="builder.intro"></p>

          <form id="order-form" novalidate>
            <p class="form-summary" id="form-summary" role="alert" hidden></p>

            <fieldset class="field">
              <legend><span data-t="builder.colorLabel"></span>: <strong id="color-name"></strong></legend>
              <div class="swatches" id="swatches"></div>
            </fieldset>

            <div class="field">
              <div class="label-row">
                <label for="f-engraving" data-t="builder.engravingLabel"></label>
                <span class="counter" id="engraving-counter" aria-live="polite"></span>
              </div>
              <input id="f-engraving" name="engraving" type="text" autocomplete="off" data-t-attr="placeholder:builder.engravingPlaceholder" aria-describedby="hint-engraving err-engraving">
              <p class="field-hint" id="hint-engraving" data-t="builder.engravingHint"></p>
              <p class="field-error" id="err-engraving" hidden></p>
            </div>

            <fieldset class="field">
              <legend data-t="builder.fontLabel"></legend>
              <div class="choices" id="font-choices"></div>
            </fieldset>

            <div class="field qty-field">
              <span class="qty-label" id="qty-label" data-t="builder.qtyLabel"></span>
              <div class="qty" role="group" aria-labelledby="qty-label">
                <button type="button" class="qty-btn" id="qty-minus" data-t-attr="aria-label:builder.qtyMinus">−</button>
                <output id="qty-value" aria-live="polite">1</output>
                <button type="button" class="qty-btn" id="qty-plus" data-t-attr="aria-label:builder.qtyPlus">+</button>
              </div>
              <a class="qty-more" href="#business" id="qty-more" data-t="builder.qtyMore" hidden></a>
            </div>

            <div class="total">
              <span data-t="builder.totalLabel"></span>
              <strong id="total"></strong>
            </div>

            <h3 class="contacts-title" data-t="builder.contactsTitle"></h3>

            <div class="field">
              <label for="f-name" data-t="builder.nameLabel"></label>
              <input id="f-name" name="name" type="text" autocomplete="name" maxlength="80" required aria-describedby="err-name">
              <p class="field-error" id="err-name" hidden></p>
            </div>

            <div class="field">
              <label for="f-phone" data-t="builder.phoneLabel"></label>
              <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" required aria-describedby="hint-phone err-phone">
              <p class="field-hint" id="hint-phone" data-t="builder.phoneHint"></p>
              <p class="field-error" id="err-phone" hidden></p>
            </div>

            <div class="field">
              <label for="f-city" data-t="builder.cityLabel"></label>
              <div class="select-wrap"><select id="f-city" name="city" required aria-describedby="err-city"></select></div>
              <p class="field-error" id="err-city" hidden></p>
            </div>

            <div class="hp" aria-hidden="true">
              <label for="f-website">Website</label>
              <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <div class="field">
              <label class="check" for="f-consent">
                <input id="f-consent" name="consent" type="checkbox" required aria-describedby="err-consent">
                <span data-t="builder.consent"></span>
              </label>
              <a class="consent-link" href="privacy.html" data-t="builder.consentLink"></a>
              <p class="field-error" id="err-consent" hidden></p>
            </div>

            <button class="btn btn-block" type="submit" id="f-submit" data-t="builder.submit"></button>
            <p class="pay-note" data-t="builder.payNote"></p>
          </form>

          <div class="result" id="result-ok" role="status" tabindex="-1" hidden>
            <svg class="result-stars" viewBox="0 0 64 40" aria-hidden="true"><use href="#stars"/></svg>
            <p class="result-title" data-t="builder.successTitle"></p>
            <p class="result-order" id="result-order"></p>
            <p class="result-text" data-t="builder.successText"></p>
            <a class="btn btn-outline js-order-wa" target="_blank" rel="noopener">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-icon"/></svg>
              <span data-t="builder.successButton"></span>
            </a>
          </div>

          <div class="result result-fail" id="result-fail" role="alert" tabindex="-1" hidden>
            <p class="result-title" data-t="builder.failTitle"></p>
            <p class="result-text" data-t="builder.failText"></p>
            <a class="btn js-order-wa" target="_blank" rel="noopener">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-icon"/></svg>
              <span data-t="builder.successButton"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- 6. Как это работает -->
    <section class="section steps reveal" aria-labelledby="steps-title">
      <div class="wrap">
        <h2 id="steps-title" data-t="steps.title"></h2>
        <ol class="step-list" data-list="steps.items"></ol>
      </div>
    </section>

    <!-- 7. Для компаний -->
    <section class="business" id="business" aria-labelledby="business-title">
      <div class="wrap business-inner">
        <h2 id="business-title" data-t="business.title"></h2>
        <p class="business-text" data-t="business.text"></p>
        <a class="btn btn-brass js-wa-business" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-icon"/></svg>
          <span data-t="business.cta"></span>
        </a>
      </div>
    </section>

    <!-- 8. Вопросы -->
    <section class="section faq reveal" aria-labelledby="faq-title">
      <div class="wrap narrow">
        <h2 id="faq-title" data-t="faq.title"></h2>
        <div class="faq-list" data-list="faq.items"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <svg class="footer-mark" viewBox="0 0 64 40" aria-hidden="true"><use href="#stars"/></svg>
        <p class="footer-word">Ürker</p>
        <p data-t="footer.brand"></p>
        <p data-t="footer.origin"></p>
      </div>
      <div class="footer-links">
        <a class="btn btn-outline js-wa" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-icon"/></svg>
          <span data-t="footer.whatsapp"></span>
        </a>
        <a class="footer-link js-ig js-ig-text" target="_blank" rel="noopener"></a>
        <a class="footer-link" href="privacy.html" data-t="footer.privacy"></a>
      </div>
      <p class="footer-seller" data-t="footer.seller"></p>
      <p class="footer-copy">© <span id="year">2026</span> Ürker</p>
    </div>
  </footer>

  <a class="wa-float js-wa" target="_blank" rel="noopener" data-t-attr="aria-label:whatsappFloatLabel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-icon"/></svg>
  </a>

  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="art.js"></script>
  <script src="main.js"></script>
</body>
</html>
