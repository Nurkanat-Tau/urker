<!doctype html>

<body data-page="privacy">

        <line x1="16" y1="26" x2="29" y2="30"/><line x1="29" y1="30" x2="38" y2="22"/><line x1="38" y1="22" x2="52" y2="24"/>

      <div data-list="privacy.sections"></div>

  <script src="config.js?v=20261128a"></script>
